version: '3.8'

# Caddy lives in the united-states-suiji stack on this box: only one container
# can hold ports 80 and 443, so that one terminates TLS for both sites and
# reaches this one over the shared `edge` network.
services:
  web:
    image: bugg86/ltc-site:latest
    container_name: ltc-site-web
    environment:
      - MONGODB_URI=mongodb://ltcuser:ltcpass@mongo:27017/ltcdb?authSource=ltcdb
      - NODE_OPTIONS=--enable-source-maps
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      # `edge` is where the box's Caddy reaches this container, by the name
      # above; `ltc-network` is this stack's own, where mongo lives.
      - ltc-network
      - edge

  mongo:
    image: mongo:6.0
    container_name: ltc-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ltcdb
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ltc-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 120s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:

networks:
  ltc-network:
    driver: bridge
  # Owned by neither stack: whichever deploy runs first creates it, and the
  # Caddy in united-states-suiji joins it too.
  edge:
    external: true
