name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
          
      - name: Login to docker
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ vars.SITE_NAME }}:latest
            #${{ vars.SITE_NAME }}:$(date +%s)
          file: ./Dockerfile
          platforms: linux/amd64
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          password: ${{secrets.SSH_PASSWORD}}
          port: 23
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{vars.SITE_NAME }}:latest
            curl -o docker-compose-prod.yml -L "https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose-prod.yml"
            docker compose -f docker-compose-prod.yml up -d
