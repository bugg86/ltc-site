name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
          
      - name: Login to docker
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ vars.SITE_NAME }}:latest
            #${{ vars.SITE_NAME }}:$(date +%s)
          file: ./Dockerfile
          platforms: linux/amd64
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USERNAME}}
          password: ${{secrets.SSH_PASSWORD}}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{vars.SITE_NAME }}:latest
            curl -o docker-compose-prod.yml -L "https://raw.githubusercontent.com/bugg86/ltc-site/refs/heads/master/docker-compose-prod.yml"
            curl -o init-mongo.js -L "https://raw.githubusercontent.com/bugg86/ltc-site/refs/heads/master/init-mongo.js"
            # Shared with the united-states-suiji stack, whose Caddy serves
            # this site too. Created here if that stack has not been deployed
            # yet, since compose refuses to start without it.
            docker network inspect edge >/dev/null 2>&1 || docker network create edge

            # The compose file now fixes the project name. Containers left by
            # an older one still hold these names, and compose will not take a
            # name from another project, so drop those. Only the containers:
            # the volumes they used are what the data lives in.
            for c in ltc-site-web ltc-mongo; do
              owner=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c" 2>/dev/null || true)
              if [ -n "$owner" ] && [ "$owner" != "ltc-site" ]; then
                echo "removing $c, left behind by the '$owner' project"
                docker rm -f "$c" >/dev/null
              fi
            done
            # --remove-orphans clears the retired ltc-caddy container.
            docker compose -f docker-compose-prod.yml up -d --remove-orphans
